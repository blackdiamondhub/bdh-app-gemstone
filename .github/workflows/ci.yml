name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hub:
    uses: blackdiamondhub/bdh-sdk/.github/workflows/app-ci.yml@v0
    with:
      app_id: gemstone

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/js/*.test.js

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdh-app-gemstone"
version = "0.1.0b10"
description = "Black Diamond Hub app: play, design and set up Gemstone Lights"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bdh-sdk>=0.36,<1",
    "pygemstone>=0.2.0",
    "aiohttp>=3.9",
    "Pillow>=10",
]

[project.urls]
Source = "https://github.com/blackdiamondlodge/bdh-app-gemstone"

[project.entry-points."blackdiamondhub.plugins"]
gemstone = "gemstone.plugin:spec"

[tool.setuptools.packages.find]
include = ["gemstone", "gemstone.*"]

[tool.setuptools.package-data]
gemstone = [
    "templates/**/*",
    "static/**/*",
    "tests/*.txt",
]
